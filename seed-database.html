        // Fetch cover from OpenLibrary
        async function fetchCover(searchKey, title) {
            try {
                const resp = await fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(searchKey) + '&limit=1');
                const data = await resp.json();
                if (data.docs && data.docs.length > 0 && data.docs[0].cover_i) {
                    coversLoaded++;
                    coversCount.textContent = coversLoaded;
                    return 'https://covers.openlibrary.org/b/id/' + data.docs[0].cover_i + '-L.jpg';
                }
            } catch(e) {
                console.warn('Cover fetch failed for:', title);
            }
            return 'assets/books/book-placeholder.png';
        }

        async function startSeeding() {
            seedBtn.disabled = true;
            seedBtn.textContent = 'Seeding...';
            
            try {
                writeLog('Checking database collections...', 'info');

                // ── 1. Users (Firebase Auth + Firestore profile) ──
                writeLog('Seeding users...', 'info');
                let userCount = 0;
                for (const user of USERS) {
                    try {
                        const cred = await createUserWithEmailAndPassword(auth, user.email, user.password);
                        await setDoc(doc(db, 'users', cred.user.uid), {
                            email: user.email,
                            displayName: user.displayName,
                            role: user.role,
                            createdAt: serverTimestamp()
                        });
                        writeLog(`✓ Created ${user.role}: ${user.email}`, 'success');
                        userCount++;
                    } catch(e) {
                        if (e.code === 'auth/email-already-exists') {
                            writeLog(`User exists: ${user.email}`, 'info');
                        } else {
                            writeLog(`User error: ${e.message}`, 'error');
                        }
                    }
                }
                usersCount.textContent = userCount || 'already exists';

                // ── 2. Settings ──
                writeLog('Seeding settings...', 'info');
                await setDoc(doc(db, 'settings', 'site'), SETTINGS);
                writeLog('✓ Settings seeded!', 'success');

                // ── 3. Products ──
                writeLog('Checking products collection...', 'info');
                const productsCheck = await getDocs(collection(db, 'products'));
                if (productsCheck.empty) {
                    writeLog(`Seeding ${PRODUCTS.length} products...`, 'info');
                    for (const p of PRODUCTS) {
                        await setDoc(doc(db, 'products', p.id), p);
                        writeLog(`✓ Product: ${p.name}`, 'success');
                    }
                    productsCount.textContent = PRODUCTS.length;
                    writeLog(`✅ ${PRODUCTS.length} products seeded.`, 'success');
                } else {
                    writeLog(`Products already seeded (${productsCheck.size} found). Skipping...`, 'info');
                    productsCount.textContent = productsCheck.size;
                }

                // ── 4. Books with Covers ──
                writeLog('Checking books collection...', 'info');
                const booksCheck = await getDocs(collection(db, 'books'));
                if (!booksCheck.empty) {
                    writeLog(`Books already seeded (${booksCheck.size} found). Skipping...`, 'info');
                    booksCount.textContent = booksCheck.size;
                } else {
                    totalBooks = BOOKS.length;
                    writeLog(`Fetching covers and seeding ${totalBooks} books...`, 'info');
                    
                    for (let i = 0; i < BOOKS.length; i++) {
                        const book = BOOKS[i];
                        const coverUrl = await fetchCover(book.searchKey, book.title);
                        
                        await addDoc(collection(db, 'books'), {
                            title: book.title,
                            author: book.author,
                            phase: book.phase,
                            phaseOrder: book.phaseOrder,
                            category: book.category,
                            price: book.price,
                            searchKey: book.searchKey,
                            img: coverUrl,
                            description: book.title + ' by ' + book.author + '. Part of ' + book.phase + '.',
                            status: 'active',
                            createdAt: serverTimestamp()
                        });
                        
                        updateProgress(i + 1, totalBooks);
                        booksCount.textContent = i + 1;
                        
                        const icon = coverUrl.includes('openlibrary') ? '✓' : '○';
                        writeLog(icon + ' ' + book.title, coverUrl.includes('openlibrary') ? 'success' : 'warning');
                        
                        await new Promise(r => setTimeout(r, 200));
                    }
                    writeLog(`✅ ${totalBooks} books with ${coversLoaded} covers loaded.`, 'success');
                }

                writeLog('✅ Seeding complete!', 'success');
                seedBtn.textContent = 'Seeding Complete ✓';

            } catch(e) {
                writeLog('Error: ' + e.message, 'error');
                seedBtn.disabled = false;
                seedBtn.textContent = 'Retry Seeding';
            }
        }

        window.startSeeding = startSeeding;
    </script>
