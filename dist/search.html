<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#800020">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Archive — DOMIINIQUE</title>
    <link rel="stylesheet" href="css/main.css?v=9">
    <link rel="stylesheet" href="css/home.css?v=1">
    <style>
        .search-results-page {
            padding: 120px 0 60px;
            min-height: 80vh;
        }
        .search-hero {
            text-align: center;
            margin-bottom: 4rem;
        }
        .search-input-large {
            width: 100%;
            max-width: 600px;
            background: var(--bg2);
            border: 1px solid var(--border-soft);
            color: var(--fg);
            padding: 1.2rem 2rem;
            border-radius: 100px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .search-input-large:focus {
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .results-info {
            margin-bottom: 2rem;
            color: var(--fg-sub);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        #search-results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
        }
    </style>

    <link rel="icon" href="assets/domiinique_logo.png" type="image/png">
</head>
<body>
    <!-- --- NAV --- -->
    <nav id="nav" role="navigation" aria-label="Main Navigation">
        <a class="nav__logo" href="index.html">
            <span class="nav__logo-text">DOMIINIQUE</span>
            <span class="nav__logo-motto">Living Signature</span>
        </a>
        <ul class="nav__links">
            <li><a href="blueprint.html">Blueprint</a></li>
            <li><a href="integrated.html">The Empire</a></li>
            <li><a href="time.html">Time</a></li>
            <li><a href="inspiration.html">Inspiration</a></li>
            <li><a href="creative.html">Creative</a></li>
            <li><a href="canvas.html">Canvas</a></li>
            <li><a href="portraits.html">Portraits</a></li>
            <li><a href="journal.html">Journal</a></li>
            <li><a href="you.html">YOU</a></li>
            <li><a href="cocreation.html">Co-Creation</a></li>
            <li><a href="shop.html">Catalog</a></li>
            <li><a href="checkout.html">Acquired</a></li>
        </ul>
        <div class="nav__utilities">
            
            <a href="books.html" class="nav-icon-btn" title="Book Archive" aria-label="Books">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
            </a>
            <a href="login.html" id="nav-auth-btn" class="nav-icon-btn" title="Archive Access" aria-label="Login">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            </a>
            <a href="search.html" class="nav-icon-btn dom-search-btn" title="Search" aria-label="Search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></a>
            <button id="music-btn" class="music-btn" aria-label="Play music" title="Toggle Music">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M499.1 6.3c8.1 6 12.9 15.6 12.9 25.7v72 264c0 44.2-43 80-96 80s-96-35.8-96-80s43-80 96-80c11.2 0 22 1.6 32 4.6V147L192 223.8V456c0 44.2-43 80-96 80s-96-35.8-96-80s43-80 96-80c11.2 0 22 1.6 32 4.6V200 128c0-14.1 9.3-26.6 22.8-30.7l320-96c9.7-2.9 20.2-1.1 28.3 5z"/></svg>
            </button>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle Light/Dark">&#x1F319;</button>
            <div class="nav__hamburger" id="hamburger" aria-label="Open menu" role="button" tabindex="0" aria-expanded="false">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <main class="search-results-page container">
        <header class="search-hero">
            <span class="t-eyebrow">The Collective Mind</span>
            <h1 class="t-h2">Search the Archive</h1>
            <div style="margin-top:2rem;">
                <input type="text" id="page-search-input" class="search-input-large" placeholder="Search by title, author, or topic..." autofocus>
            </div>
        </header>

        <div class="results-info" id="results-count">Enter a query to begin exploration</div>
        
        <div id="search-results-grid">
            <!-- Results populated by search.js -->
        </div>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="book-modal" onclick="if(event.target.id==='book-modal') window.closeBookModal()">
        <div class="product-modal">
            <button class="modal__close" onclick="window.closeBookModal()">&times;</button>
            <div class="modal__img"><img id="modal-img" src=""><div class="modal__img-overlay"></div></div>
            <div class="modal__body">
                <span class="modal__cat" id="modal-author"></span>
                <h2 class="modal__name" id="modal-title"></h2>
                <div class="modal__divider"></div>
                <p class="modal__desc" id="modal-desc"></p>
                <div class="modal__price-row">
                    <span class="modal__price" id="modal-price"></span>
                    <button class="modal__add-btn" id="modal-cart-btn" onclick="window.addToCartFromModal()">Acquire</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js" defer></script>
    <script type="module" src="js/search.js" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('page-search-input');
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            
            if (query) {
                input.value = query;
                if (window.performSiteSearch) window.performSiteSearch(query, 'search-results-grid');
            }

            input.addEventListener('input', (e) => {
                if(window.performSiteSearch) window.performSiteSearch(e.target.value, 'search-results-grid');
            });
        });
    </script>
    <!-- --- FREQUENCY AUDIO --- -->
    <audio id="bg-audio" loop preload="none" src="assets/bg_music.mp3"></audio>

</body>
</html>
