<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmission Confirmed | Domiinique</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root {
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #4CAF50; /* Success Green */
        }

        body {
            background: #0a0a0c;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            color: #fff;
        }

        /* Ambient Background Shadows */
        .ambient-glow {
            position: fixed;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(76, 175, 80, 0.08) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
        }

        .receipt-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-seal {
            width: 64px;
            height: 64px;
            background: rgba(76, 175, 80, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: var(--accent);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .receipt-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .receipt-subtitle {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .qr-section {
            background: #fff;
            padding: 1.5rem;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .qr-section:hover {
            transform: scale(1.02);
        }

        .qr-image {
            width: 180px;
            height: 180px;
            display: block;
        }

        .order-meta {
            text-align: left;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
        }

        .meta-row:last-child {
            margin-bottom: 0;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-weight: 700;
            font-size: 1rem;
        }

        .label { color: rgba(255,255,255,0.4); }
        .value { font-family: 'Space Mono', monospace; letter-spacing: 0.02em; }

        .screenshot-notice {
            font-size: 0.75rem;
            background: rgba(76, 175, 80, 0.1);
            color: var(--accent);
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-link {
            text-decoration: none;
            color: #fff;
            font-size: 0.85rem;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .btn-link:hover { opacity: 1; }

        @media (max-width: 480px) {
            .receipt-card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="receipt-card">
        <div class="success-seal">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>

        <h1 class="receipt-title">Transmission Received</h1>
        <p class="receipt-subtitle">Archive Receipt</p>

        <div class="qr-section">
            <img id="qr-code" src="" alt="Order QR Code" class="qr-image">
        </div>

        <div class="order-meta">
            <div class="meta-row">
                <span class="label">Archive ID</span>
                <span class="value" id="disp-order-id">#---</span>
            </div>
            <div class="meta-row">
                <span class="label">Date</span>
                <span class="value" id="disp-date">--. --. ----</span>
            </div>
            
            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05);">
                <span class="label" style="display: block; margin-bottom: 0.8rem; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em;">Archive Contents</span>
                <div id="receipt-items-list" style="max-height: 200px; overflow-y: auto;">
                    <!-- Items populated here -->
                </div>
            </div>

            <div class="meta-row" style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <span class="label">Total Amount</span>
                <span class="value" id="disp-total">0.00 ETB</span>
            </div>
        </div>

        <div class="screenshot-notice">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            <span>Capture this transmission for your records.</span>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn-link">Return to Home</a>
            <a href="shop.html" class="btn-link">Continue Exploring the Catalog</a>
        </div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId') || 'INTERNAL-ERR';
        const total = urlParams.get('total') || '0.00';
        
        // Populate fields
        document.getElementById('disp-order-id').textContent = '#' + orderId;
        document.getElementById('disp-total').textContent = parseFloat(total).toLocaleString() + ' ETB';
        document.getElementById('disp-date').textContent = new Date().toLocaleDateString('en-GB', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });

        // Populate Items from sessionStorage
        const itemsList = document.getElementById('receipt-items-list');
        const storedItems = sessionStorage.getItem('lastOrderItems');
        let calculatedTotal = 0;
        
        if (storedItems) {
            try {
                const items = JSON.parse(storedItems);
                itemsList.innerHTML = items.map(item => {
                    const lineTotal = (item.price * (item.quantity || 1));
                    calculatedTotal += lineTotal;
                    return `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.75rem; opacity: 0.8;">
                            <span>${item.title} x${item.quantity || 1}</span>
                            <span>${lineTotal.toLocaleString()} ETB</span>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.warn('Error parsing receipt items:', e);
                itemsList.innerHTML = '<p style="font-size:0.7rem; opacity:0.5;">Contents encrypted or unavailable.</p>';
            }
        } else {
            itemsList.innerHTML = '<p style="font-size:0.7rem; opacity:0.5;">Contents transmission pending.</p>';
        }

        // Final total resolution: Use calculated if URL param is missing/zero
        const finalTotal = (parseFloat(total) || calculatedTotal);
        document.getElementById('disp-total').textContent = finalTotal.toLocaleString() + ' ETB';

        // Generate QR Code (Points to the order ID for admin verification)
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=${encodeURIComponent(orderId)}&color=0a0a0c&bgcolor=ffffff&qzone=2`;
        document.getElementById('qr-code').src = qrUrl;
    </script>
</body>
</html>
