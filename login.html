<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#800020">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domiinique — Integrated Access</title>
  <meta name="description" content="Sign in or register for the Domiinique Integrated Living System.">
  <link rel="stylesheet" href="css/main.css?v=9">
  <script type="module" src="js/auth.js"></script>
  <script>
    // If already logged in, redirect to Integrated immediately
    function checkAlreadyIn() {
      if (window.domAuth && window.domAuth.isReady()) {
        if (window.domAuth.getUser()) window.location.replace('integrated.html');
      } else {
        // Wait for auth module to initialize and Firebase to settle
        setTimeout(checkAlreadyIn, 100);
      }
    }
    checkAlreadyIn();
  </script>
  <link rel="icon" type="image/png" href="assets/domiinique_logo.png">
  <link rel="apple-touch-icon" href="assets/domiinique_logo.png">
  <style>
    /* ── Login page exclusive styles ── */
    html,
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100dvh;
    }

    body {
      background: #0a0609;
    }

    canvas#login-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: all;
      width: 100%;
      height: 100%;
    }

    .login-wrapper {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      pointer-events: none;
    }

    .login-card {
      pointer-events: all;
      width: 100%;
      max-width: 440px;
      background: rgba(12, 9, 8, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(128, 0, 32, .35);
      border-radius: 18px;
      box-shadow: 0 60px 140px rgba(0, 0, 0, .85), 0 0 80px rgba(128, 0, 32, .12);
      overflow: hidden;
      animation: cardIn .7s cubic-bezier(.23, 1, .32, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .login-header {
      padding: 2.4rem 2.4rem 0;
      text-align: center;
    }

    .login-logo {
      font-family: 'Bickham Script Pro', 'OldLondon', 'Luxurious Script', cursive;
      font-size: 3rem;
      line-height: 1;
      color: #f0ebe3;
      text-shadow: 0 0 40px rgba(128, 0, 32, .4);
      display: block;
      margin-bottom: .2rem;
    }

    .login-sub {
      font-size: .54rem;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: rgba(201, 168, 76, .7);
      display: block;
      margin-bottom: 1.8rem;
    }

    /* Tabs */
    .login-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      margin: 0 2.4rem;
    }

    .login-tab {
      flex: 1;
      padding: .75rem;
      text-align: center;
      font-size: .58rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: rgba(240, 235, 227, .35);
      cursor: pointer;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      transition: all .3s;
      margin-bottom: -1px;
    }

    .login-tab.active {
      color: #f0ebe3;
      border-bottom-color: #800020;
    }

    .login-tab:hover {
      color: #f0ebe3;
    }

    /* Forms */
    .login-panels {
      padding: 1.8rem 2.4rem 2.4rem;
    }

    .login-panel {
      display: none;
    }

    .login-panel.active {
      display: block;
      animation: fadeIn .35s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .login-field {
      margin-bottom: 1.1rem;
    }

    .login-field label {
      display: block;
      font-size: .56rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(240, 235, 227, .45);
      margin-bottom: .45rem;
    }

    .login-field input {
      width: 100%;
      background: rgba(255, 255, 255, .05);
      border: 1.5px solid rgba(255, 255, 255, .1);
      border-radius: 7px;
      padding: .72rem 1rem;
      color: #f0ebe3;
      font-family: inherit;
      font-size: .9rem;
      outline: none;
      transition: border-color .3s, background .3s;
      box-sizing: border-box;
    }

    .login-field input:focus {
      border-color: #800020;
      background: rgba(128, 0, 32, .07);
    }

    .login-btn {
      width: 100%;
      padding: .9rem;
      background: #800020;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: .58rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: .4rem;
      transition: background .3s, transform .2s, box-shadow .3s;
      box-shadow: 0 8px 24px rgba(128, 0, 32, .35);
    }

    .login-btn:hover {
      background: #9a0025;
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(128, 0, 32, .45);
    }

    .login-btn:active {
      transform: none;
    }

    .login-msg {
      margin-top: .9rem;
      padding: .7rem 1rem;
      border-radius: 6px;
      font-size: .78rem;
      text-align: center;
      display: none;
    }

    .login-msg.error {
      background: rgba(200, 0, 0, .12);
      color: #ff7070;
      border: 1px solid rgba(200, 0, 0, .2);
    }

    .login-msg.success {
      background: rgba(46, 204, 113, .1);
      color: #5ddb8e;
      border: 1px solid rgba(46, 204, 113, .2);
    }

    .login-footer-text {
      text-align: center;
      font-size: .65rem;
      color: rgba(240, 235, 227, .3);
      margin-top: 1.4rem;
      line-height: 1.6;
    }

    .login-back-link {
      display: block;
      text-align: center;
      margin-top: .8rem;
      font-size: .58rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(201, 168, 76, .6);
      text-decoration: none;
      transition: color .3s;
    }

    .login-back-link:hover {
      color: rgba(201, 168, 76, 1);
    }

    /* ── Mobile ── */
    @media(max-width:480px) {
      .login-card {
        border-radius: 12px;
      }

      .login-header {
        padding: 2rem 1.6rem 0;
      }

      .login-tabs {
        margin: 0 1.6rem;
      }

      .login-panels {
        padding: 1.5rem 1.6rem 2rem;
      }

      .login-logo {
        font-size: 2.4rem;
      }
    }
  </style>
</head>

<body>

  <!-- Three.js Chandelier Canvas -->
  <canvas id="login-canvas"></canvas>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <span class="login-logo">Domiinique</span>
        <span class="login-sub">Integrated Living System</span>
      </div>

      <!-- Tabs -->
      <div class="login-tabs">
        <button class="login-tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="login-tab" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div class="login-panels">

        <!-- ── Sign In Panel ── -->
        <div class="login-panel active" id="panel-signin">
          <div class="login-field">
            <label>Username</label>
            <input type="text" id="si-username" placeholder="your_username" autocomplete="username">
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password">
          </div>
          <button class="login-btn" onclick="doSignIn()">Enter the System →</button>
          <div class="login-msg" id="si-msg"></div>
          <p class="login-footer-text">Access to the Integrated system is by invitation and admin approval only.</p>
        </div>

        <!-- ── Register Panel ── -->
        <div class="login-panel" id="panel-register">
          <div class="login-field">
            <label>Full Name</label>
            <input type="text" id="reg-name" placeholder="Your Name" autocomplete="name">
          </div>
          <div class="login-field">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="choose_a_username" autocomplete="username">
          </div>
          <div class="login-field">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div class="login-field">
            <label>Phone (optional)</label>
            <input type="tel" id="reg-phone" placeholder="+251...">
          </div>
          <div class="login-field">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Min. 6 characters">
          </div>
          <div class="login-field">
            <label>Confirm Password</label>
            <input type="password" id="reg-confirm" placeholder="Repeat password">
          </div>
          <button class="login-btn" onclick="doRegister()">Submit Application →</button>
          <div class="login-msg" id="reg-msg"></div>
          <p class="login-footer-text">Your application will be reviewed by an administrator before access is granted.
          </p>
        </div>

      </div>

      <a href="index.html" class="login-back-link">← Back to Home</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script>
    /* ════════════════════════════════════
       AUTH LOGIC
    ════════════════════════════════════ */
    function switchTab(tab) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.login-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    function showMsg(id, text, type) {
      var el = document.getElementById(id);
      el.textContent = text;
      el.className = 'login-msg ' + type;
      el.style.display = 'block';
    }

    async function doSignIn() {
      var username = document.getElementById('si-username').value.trim();
      var password = document.getElementById('si-password').value;
      var btn = document.querySelector('#panel-signin .login-btn');

      if (!username || !password) { showMsg('si-msg', 'Please enter your username and password.', 'error'); return; }

      btn.textContent = "Authenticating...";
      btn.disabled = true;

      var res = await window.domAuth.login(username, password);

      btn.textContent = "Enter the System →";
      btn.disabled = false;

      if (res.success) {
        showMsg('si-msg', res.message, 'success');
        setTimeout(function () { window.location.href = 'integrated.html'; }, 1200);
      } else {
        showMsg('si-msg', res.message, 'error');
      }
    }

    async function doRegister() {
      var name = document.getElementById('reg-name').value.trim();
      var username = document.getElementById('reg-username').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var phone = document.getElementById('reg-phone').value.trim();
      var pass = document.getElementById('reg-password').value;
      var conf = document.getElementById('reg-confirm').value;
      var btn = document.querySelector('#panel-register .login-btn');

      if (pass !== conf) { showMsg('reg-msg', 'Passwords do not match.', 'error'); return; }

      btn.textContent = "Creating Account...";
      btn.disabled = true;

      var res = await window.domAuth.register(username, email, pass, name, phone);

      btn.textContent = "Submit Application →";
      btn.disabled = false;

      if (res.success) {
        // Show immediate success with the 24h mention
        showMsg('reg-msg', 'Registration successful! Due to high demand, please wait up to 24 hours for administrator approval.', 'success');

        document.getElementById('reg-password').value = '';
        document.getElementById('reg-confirm').value = '';

        // Immediate redirect to sign-in tab as requested
        setTimeout(() => {
          switchTab('signin');
          showMsg('si-msg', 'Account pending. Please wait at least 24 hours for admin confirmation before signing in.', 'info');
          // Clear registration form and message
          document.querySelectorAll('#panel-register input').forEach(i => { i.value = ''; i.disabled = false; });
          document.getElementById('reg-msg').style.display = 'none';
          btn.textContent = "Submit Application →";
          btn.disabled = false;
        }, 1200);
      } else {
        showMsg('reg-msg', res.message, 'error');
      }
    }

    // Enter key support
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var active = document.querySelector('.login-panel.active').id;
      if (active === 'panel-signin') doSignIn();
      else doRegister();
    });

    // If already logged in, redirect
    if (window.domAuth && window.domAuth.getUser()) {
      window.location.href = 'integrated.html';
    }

    /* ════════════════════════════════════
       THREE.JS CHANDELIER BACKGROUND
    ════════════════════════════════════ */
    (function () {
      var canvas = document.getElementById('login-canvas');
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x09060a);
      scene.fog = new THREE.FogExp2(0x09060a, 0.025);

      var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 2.5, 7.5);
      camera.lookAt(0, 1.5, 0);

      // Mouse tracking
      var mouse = { x: 0, y: 0 };
      document.addEventListener('mousemove', function (e) {
        mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
        mouse.y = -(e.clientY / window.innerHeight - 0.5) * 2;
      });

      // Ambient
      scene.add(new THREE.AmbientLight(0x1a0a15, 0.5));

      // Ceiling structure
      var ceilGeo = new THREE.BoxGeometry(12, 0.2, 12);
      var ceilMat = new THREE.MeshStandardMaterial({ color: 0x1a0508, roughness: 0.9, metalness: 0.1 });
      var ceil = new THREE.Mesh(ceilGeo, ceilMat);
      ceil.position.y = 6;
      scene.add(ceil);

      // Chain
      var chainMat = new THREE.MeshStandardMaterial({ color: 0xc9a84c, roughness: 0.4, metalness: 0.9 });
      for (var ci = 0; ci < 8; ci++) {
        var cg = new THREE.CylinderGeometry(0.02, 0.02, 0.4, 6);
        var cm = new THREE.Mesh(cg, chainMat);
        cm.position.set(0, 6.5 - ci * 0.45, 0);
        scene.add(cm);
      }

      // Chandelier base ring
      var ringGeo = new THREE.TorusGeometry(1.4, 0.06, 12, 40);
      var ringMat = new THREE.MeshStandardMaterial({ color: 0xb8973c, roughness: 0.3, metalness: 0.9 });
      var ring = new THREE.Mesh(ringGeo, ringMat);
      ring.position.y = 2.6;
      ring.rotation.x = Math.PI * 0.5;
      scene.add(ring);

      // Small decorative arms
      var armMat = new THREE.MeshStandardMaterial({ color: 0x996630, roughness: 0.5, metalness: 0.8 });
      for (var ai = 0; ai < 8; ai++) {
        var angle = (ai / 8) * Math.PI * 2;
        var ag = new THREE.CylinderGeometry(0.015, 0.015, 0.8, 6);
        var am = new THREE.Mesh(ag, armMat);
        am.position.set(Math.cos(angle) * 1.4, 2.6, Math.sin(angle) * 1.4);
        am.rotation.z = Math.PI * 0.3;
        am.rotation.y = -angle;
        scene.add(am);
      }

      // Candle holders + lights
      var lights = [];
      var candleMat = new THREE.MeshStandardMaterial({ color: 0xfff5cc, emissive: 0xffd060, emissiveIntensity: 0.8, roughness: 0.2 });
      var holderMat = new THREE.MeshStandardMaterial({ color: 0xb8973c, roughness: 0.3, metalness: 0.9 });

      for (var li = 0; li < 8; li++) {
        var laRad = (li / 8) * Math.PI * 2;
        var lx = Math.cos(laRad) * 1.4;
        var lz = Math.sin(laRad) * 1.4;
        var ly = 2.5;

        // Holder
        var hg = new THREE.CylinderGeometry(0.07, 0.09, 0.12, 10);
        var hm = new THREE.Mesh(hg, holderMat);
        hm.position.set(lx, ly, lz);
        scene.add(hm);

        // Candle
        var cg2 = new THREE.CylinderGeometry(0.04, 0.04, 0.3, 8);
        var cm2 = new THREE.Mesh(cg2, candleMat);
        cm2.position.set(lx, ly + 0.2, lz);
        scene.add(cm2);

        // Flame (cone)
        var fg = new THREE.ConeGeometry(0.025, 0.12, 8);
        var fm = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xffaa00, emissiveIntensity: 2, transparent: true, opacity: 0.85 });
        var fl = new THREE.Mesh(fg, fm);
        fl.position.set(lx, ly + 0.42, lz);
        scene.add(fl);

        // Point light
        var pl = new THREE.PointLight(0xffcc66, 1.2, 6);
        pl.position.set(lx, ly + 0.5, lz);
        scene.add(pl);
        lights.push({ light: pl, flame: fl, flameMat: fm, baseIntensity: 1.2, phase: Math.random() * Math.PI * 2 });
      }

      // Central pendant crystal
      var crystalGeo = new THREE.OctahedronGeometry(0.35, 0);
      var crystalMat = new THREE.MeshStandardMaterial({
        color: 0xffd080, emissive: 0x804010, emissiveIntensity: 0.4,
        roughness: 0.1, metalness: 0.6, transparent: true, opacity: 0.85
      });
      var crystal = new THREE.Mesh(crystalGeo, crystalMat);
      crystal.position.y = 1.9;
      scene.add(crystal);

      // Particles (dust motes)
      var partGeo = new THREE.BufferGeometry();
      var partCount = 300;
      var positions = new Float32Array(partCount * 3);
      for (var pi = 0; pi < partCount; pi++) {
        positions[pi * 3] = (Math.random() - 0.5) * 16;
        positions[pi * 3 + 1] = (Math.random() - 0.5) * 10 + 1;
        positions[pi * 3 + 2] = (Math.random() - 0.5) * 16;
      }
      partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      var partMat = new THREE.PointsMaterial({ color: 0xffcc88, size: 0.025, transparent: true, opacity: 0.35 });
      var particles = new THREE.Points(partGeo, partMat);
      scene.add(particles);

      // Dark mode toggle listener
      var currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      var targetExposure = currentTheme === 'dark' ? 1.2 : 2.5;
      var targetAmbient = currentTheme === 'dark' ? 0.5 : 2.0;

      window.addEventListener('themechange', function (e) {
        var isDark = e.detail && e.detail.mode === 'dark';
        targetExposure = isDark ? 1.2 : 2.5;
        targetAmbient = isDark ? 0.5 : 2.0;
        lights.forEach(function (l) { l.baseIntensity = isDark ? 1.2 : 0.5; });
      });

      var clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        var t = clock.getElapsedTime();

        // Slow camera drift following mouse
        camera.position.x += (mouse.x * 1.5 - camera.position.x) * 0.03;
        camera.position.y += (mouse.y * 0.8 + 2 - camera.position.y) * 0.03;
        camera.lookAt(0, 0.5, 0);

        // Chandelier sway
        ring.rotation.y = Math.sin(t * 0.3) * 0.04;
        crystal.rotation.y = t * 0.4;
        crystal.position.y = 0.9 + Math.sin(t * 0.7) * 0.04;

        // Flame flicker
        lights.forEach(function (l) {
          var flicker = 0.85 + 0.15 * Math.sin(t * 6 + l.phase) * Math.sin(t * 11.3 + l.phase * 2);
          l.light.intensity = l.baseIntensity * flicker;
          l.flameMat.emissiveIntensity = 1.6 * flicker;
          l.flame.scale.y = 0.9 + 0.2 * Math.sin(t * 8 + l.phase);
        });

        // Exposure blend
        renderer.toneMappingExposure += (targetExposure - renderer.toneMappingExposure) * 0.04;

        // Particles drift
        particles.rotation.y = t * 0.01;

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>

</html>
